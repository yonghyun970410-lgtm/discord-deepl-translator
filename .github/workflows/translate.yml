name: Discord announcement translator

on:
  workflow_dispatch:
  schedule:
    - cron: "2-57/5 * * * *"

permissions:
  contents: write

concurrency:
  group: discord-announcement-translator
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 필요한 프로그램 설치
        run: pip install -r requirements.txt

      - name: 새 공지 번역
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          SOURCE_CHANNEL_ID: ${{ secrets.SOURCE_CHANNEL_ID }}
          TARGET_CHANNEL_ID: ${{ secrets.TARGET_CHANNEL_ID }}
        run: python bot.py

      - name: 마지막 처리 위치 저장
        run: |
          if git diff --quiet -- state.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update translator state"
          git push
